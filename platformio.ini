; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; 默认只构建主固件; 背光扫频用 pio run -e bl-sweep
[platformio]
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	lovyan03/LovyanGFX@^1.1.16
	https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
	h2zero/NimBLE-Arduino@^1.4.3
	bblanchon/ArduinoJson@^7.0.4

; 背光啸叫排查专用: 开机后每 4 秒换一个调光频率, 屏幕和串口显示当前值。
;   pio run -e bl-sweep -t upload
; 听出最安静的频率后, 在 [env:esp32-s3-devkitm-1] 的 build_flags 里加
;   -DTFT_BL_FREQ=<频率>
[env:bl-sweep]
extends = env:esp32-s3-devkitm-1
build_flags = ${env:esp32-s3-devkitm-1.build_flags} -DTFT_BL_SWEEP
